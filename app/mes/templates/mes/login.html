<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Open-MES</title>
<style>
  :root { --bg:#f1f4f9; --card:#fff; --ink:#172033; --muted:#667085; --line:#e4e8f0; --accent:#2457d6; --bad:#c0362c; --bad-soft:#fbe7e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1018; --card:#151c28; --ink:#e9edf4; --muted:#98a3b7; --line:#243044; --accent:#6d9bff; --bad:#ff8077; --bad-soft:#3a1a18; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .box { width:min(380px, 92vw); background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; margin-bottom:18px; }
  .logo { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#2457d6,#7a5af8); }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:14px 0 4px; }
  input { width:100%; font:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); min-height:46px; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:20px; font:inherit; font-weight:700; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; min-height:48px; }
  .err { background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad); border-radius:10px; padding:10px 14px; margin-bottom:6px; font-weight:600; }
  .muted { color:var(--muted); font-size:13px; margin:16px 0 0; text-align:center; }
</style>
</head>
<body>
<form class="box" method="post">{% csrf_token %}
  <div class="brand"><span class="logo"></span> Open-MES</div>
  {% if form.errors %}<div class="err">That username and password did not match. Try again.</div>{% endif %}
  <label for="id_username">Username</label>
  <input id="id_username" name="username" autocomplete="username" autofocus required>
  <label for="id_password">Password</label>
  <input id="id_password" name="password" type="password" autocomplete="current-password" required>
  <input type="hidden" name="next" value="{{ next }}">
  <button>Sign in</button>
  <p class="muted">Ask an administrator if you need an account.</p>
</form>
</body>
</html>
